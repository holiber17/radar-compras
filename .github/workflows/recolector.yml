name: Recolector de precios
on:
  workflow_dispatch: {}          # manual desde la pestaña Actions
  # Activar solo después de revisar los términos de uso de CamelCamelCamel:
  # schedule:
  #   - cron: "0 11 * * *"       # una vez al día (UTC)
jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r tracker/requirements.txt
      - run: python -m tracker run --contact "${{ vars.CONTACTO }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
