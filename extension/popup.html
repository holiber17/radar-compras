<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Radar de Compras</title>
<style>
:root{--ink:#0F2A33;--muted:#566D74;--line:#D3DCDB;--accent:#0B6E75;--bg:#fff;--bad:#B3342B}
@media (prefers-color-scheme:dark){:root{--ink:#E4EEEE;--muted:#8FA7AD;--line:#244048;--accent:#3CC0C8;--bg:#12262C;--bad:#F08178}}
body{margin:0;width:300px;padding:16px;font:14px/1.45 system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
h1{font-size:16px;margin:0 0 12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-bottom:10px}
input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 14px;background:var(--accent);color:#fff;cursor:pointer;width:100%}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button:disabled{opacity:.6}
.msg{color:var(--bad);min-height:1.3em;margin:0 0 8px;font-size:13px}
p{margin:0 0 12px}
</style></head><body>
<h1>Radar de Compras</h1>
<form id="login" hidden novalidate>
  <label>Correo<input id="mail" type="email" autocomplete="email"></label>
  <label>Contraseña<input id="pass" type="password" autocomplete="current-password"></label>
  <p class="msg" id="msg" role="alert"></p>
  <button id="go" type="submit">Entrar</button>
</form>
<div id="ok" hidden>
  <p>Sesión iniciada. Abre un producto en amazon.com y verás el panel del radar abajo a la derecha.</p>
  <button class="ghost" id="out" type="button">Salir</button>
</div>
<script src="popup.js"></script>
</body></html>
